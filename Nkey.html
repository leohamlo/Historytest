<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Древние кыргызы — тест</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef4ff,#f8f5ff);color:#202b43;min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:white;border-radius:24px;padding:34px;width:min(100%,600px);box-shadow:0 16px 55px #344b7920}.tag{color:#5869c9;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase}h1{font-size:29px;margin:12px 0}p{color:#68748b;line-height:1.6}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 12px;color:#65718a;font-size:14px}.bar{height:10px;background:#edf0fa;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#6175e7,#9b7aee);width:0%;transition:width .3s}.question{font-size:22px;font-weight:700;line-height:1.4;margin:30px 0 20px}.options{display:grid;gap:11px}.option{border:2px solid #e8ecf5;border-radius:13px;padding:15px 17px;background:white;text-align:left;font:inherit;cursor:pointer;transition:.15s}.option:hover{border-color:#8a95ed;background:#f7f8ff}.option.selected{border-color:#6474dd;background:#f0f2ff}.primary{border:0;background:#6374e6;color:white;border-radius:13px;padding:15px 22px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:24px}.primary:hover{background:#4c5dd1}.primary:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none}.score{text-align:center;font-size:64px;font-weight:800;color:#6374e6;margin:15px 0}.center{text-align:center}.note{font-size:14px}.emoji{font-size:46px}
</style>
</head>
<body>
<main class="card">
<div class="tag">🇰🇬 История древних кыргызов</div>
<section id="intro"><h1>Что ты знаешь о древних кыргызах?</h1><p>20 вопросов о енисейских кыргызах, Кыргызском каганате, культуре и быте. Узнай свой результат в процентах.</p><button class="primary" onclick="start()">Начать тест →</button></section>
<section id="quiz" class="hidden"><div class="top"><span id="counter"></span><strong id="progressText"></strong></div><div class="bar"><div class="fill" id="fill"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><button class="primary" id="next" onclick="next()" disabled>Следующий вопрос →</button></section>
<section id="result" class="hidden center"><div class="emoji">🏆</div><h1>Тест завершён!</h1><p>Твой результат:</p><div class="score" id="score"></div><h2 id="summary"></h2><p id="message"></p><button class="primary" onclick="start()">Пройти ещё раз ↻</button></section>
</main>
<script>
const questions=[{"q":"С каким регионом историки связывают раннюю историю енисейских кыргызов?","a":["Долина Енисея","Долина Нила","Пиренеи","Апеннины"],"correct":0},{"q":"В источниках какой древней цивилизации встречаются ранние упоминания кыргызов?","a":["Древнего Рима","Древнего Китая","Древнего Египта","Древней Греции"],"correct":1},{"q":"К какому году традиционно относят одно из первых упоминаний кыргызов в китайских хрониках?","a":["201 год до н. э.","552 год н. э.","840 год н. э.","1206 год н. э."],"correct":0},{"q":"Какое государство разгромили енисейские кыргызы в 840 году?","a":["Хазарский каганат","Уйгурский каганат","Османскую империю","Золотую Орду"],"correct":1},{"q":"В каком веке произошло возвышение Кыргызского каганата после победы над уйгурами?","a":["VI век","VIII век","IX век","XIII век"],"correct":2},{"q":"Как назывался титул верховного правителя многих древних тюркских государств, в том числе Кыргызского каганата?","a":["Фараон","Каган","Консул","Император Август"],"correct":1},{"q":"Какой вид хозяйства играл важную роль в жизни древних кыргызов?","a":["Морское рыболовство","Кочевое скотоводство","Плантационное земледелие","Выращивание риса на островах"],"correct":1},{"q":"Какое животное имело особое значение для передвижения и военного дела древних кыргызов?","a":["Верблюд","Слон","Лошадь","Олень"],"correct":2},{"q":"Какую письменность использовали енисейские кыргызы?","a":["Тюркскую руническую","Латинскую","Кириллицу","Иероглифы майя"],"correct":0},{"q":"Как называются древнетюркские надписи, найденные в районе Енисея?","a":["Енисейские рунические надписи","Берестяные грамоты Новгорода","Таблички Крита","Розеттский камень"],"correct":0},{"q":"Какая река дала название енисейским кыргызам?","a":["Волга","Енисей","Амударья","Дунай"],"correct":1},{"q":"На территории какой современной страны находится основная часть Минусинской котловины?","a":["Монголии","Китая","России","Казахстана"],"correct":2},{"q":"С какой языковой группой связывают древнекыргызские рунические памятники?","a":["Тюркской","Романской","Германской","Семитской"],"correct":0},{"q":"Какой материал часто использовали для древнетюркских памятных надписей?","a":["Камень","Пластик","Бумагу для принтера","Стекловолокно"],"correct":0},{"q":"Какой тип жилища был удобен для кочевого образа жизни?","a":["Юрта","Каменный замок","Многоэтажный дом","Пирамида"],"correct":0},{"q":"Какой вид оружия был широко распространён у конных воинов древней степи?","a":["Лук и стрелы","Огнестрельная винтовка","Пушка","Арбалет с оптическим прицелом"],"correct":0},{"q":"Какая природная зона была важна для хозяйства енисейских кыргызов?","a":["Степи и лесостепи Южной Сибири","Сахара","Амазонские джунгли","Антарктида"],"correct":0},{"q":"Как называют археологические памятники, связанные с погребением умерших?","a":["Курганы","Акведуки","Амфитеатры","Маяки"],"correct":0},{"q":"Какое государство существовало в Центральной Азии до победы кыргызов в 840 году?","a":["Уйгурский каганат","Византийская республика","Империя инков","Королевство франков"],"correct":0},{"q":"Что изучает археология, помогая узнать о жизни древних кыргызов?","a":["Материальные остатки прошлого","Только современные газеты","Только прогноз погоды","Только космические снимки"],"correct":0}];
let index=0,answers=[];
const el=id=>document.getElementById(id);
function start(){index=0;answers=[];el('intro').classList.add('hidden');el('result').classList.add('hidden');el('quiz').classList.remove('hidden');render()}
function render(){let item=questions[index];el('counter').textContent=`Вопрос ${index+1} из ${questions.length}`;el('progressText').textContent=`${Math.round(index/questions.length*100)}%`;el('fill').style.width=`${index/questions.length*100}%`;el('question').textContent=item.q;el('options').innerHTML='';item.a.forEach((answer,i)=>{let b=document.createElement('button');b.className='option';b.textContent=answer;b.onclick=()=>select(i);el('options').appendChild(b)});el('next').disabled=true;el('next').textContent=index===questions.length-1?'Узнать результат →':'Следующий вопрос →'}
function select(i){answers[index]=i;[...el('options').children].forEach((b,j)=>b.classList.toggle('selected',i===j));el('next').disabled=false}
function next(){if(answers[index]===undefined)return;index++;if(index<questions.length)render();else finish()}
function finish(){let correct=questions.reduce((n,q,i)=>n+(answers[i]===q.correct?1:0),0);let pct=Math.round(correct/questions.length*100);el('quiz').classList.add('hidden');el('result').classList.remove('hidden');el('score').textContent=pct+'%';el('summary').textContent=`${correct} из ${questions.length} правильных ответов`;el('message').textContent=pct===100?'Отлично! Ты отлично знаешь историю древних кыргызов!':pct>=70?'Хороший результат!':pct>=40?'Неплохо! Есть что повторить.':'Попробуй ещё раз — получится лучше!'}
</script>
</body>
</html>
